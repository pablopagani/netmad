  <style>
    :root {
      --orange: #D9600B;
      --orange-dark: #A84708;
      --orange-light: #F0A868;
      --ink: #24282A;
      --ink-2: #565D60;
      --steel: #7C8689;
      --platinum: #B7C0C3;
      --platinum-light: #C7D0D3;
      --paper: #F4F5F5;
      --white: #FFFFFF;
      --radius: 14px;
      --max: 1120px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.6;
    }
    a { color: var(--orange); }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 24px; }
    .eyebrow {
      font-size: .8rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
      color: var(--orange);
    }
    h1, h2, h3 { font-family: Cambria, Georgia, "Times New Roman", serif; line-height: 1.2; }
    h2 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin: .4rem 0 1rem; }
    section { padding: 88px 0; }
    .lead { font-size: 1.15rem; color: var(--ink-2); max-width: 720px; }

    /* Nav */
    header.nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(36, 40, 42, .92); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
    .brand { color: var(--white); font-weight: 800; font-size: 1.3rem; text-decoration: none; letter-spacing: .02em; }
    .brand span { color: var(--orange); }
    .nav-links { display: flex; gap: 22px; list-style: none; }
    .nav-links a { color: var(--platinum); text-decoration: none; font-size: .95rem; }
    .nav-links a:hover { color: var(--white); }
    .lang-switch { display: flex; border: 1px solid var(--steel); border-radius: 999px; overflow: hidden; }
    .lang-switch button {
      background: transparent; color: var(--platinum); border: 0; padding: 6px 12px;
      font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer;
    }
    .lang-switch button[aria-pressed="true"] { background: var(--orange); color: var(--white); }
    @media (max-width: 820px) { .nav-links { display: none; } }

    /* Hero */
    .hero {
      background: radial-gradient(ellipse at 70% 30%, #3a2416 0%, var(--ink) 55%);
      color: var(--white); padding: 96px 0 104px; overflow: hidden;
    }
    .hero .wrap { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; }
    .hero h1 { font-size: clamp(3rem, 9vw, 5.5rem); letter-spacing: -.01em; }
    .hero h1 span { color: var(--orange); }
    .hero p.tag { font-size: clamp(1.15rem, 2.4vw, 1.45rem); color: var(--platinum-light); margin: 12px 0 28px; max-width: 560px; }
    .hero img { width: 100%; height: auto; filter: drop-shadow(0 0 40px rgba(217,96,11,.35)); }
    .badge {
      display: inline-flex; align-items: center; gap: 10px; margin-bottom: 18px;
      background: rgba(217,96,11,.15); border: 1px solid rgba(217,96,11,.5);
      color: var(--orange-light); border-radius: 999px; padding: 6px 14px; font-size: .9rem; font-weight: 600;
    }
    .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 10px var(--orange); }
    .cta-row { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      display: inline-block; padding: 12px 22px; border-radius: 999px; font-weight: 700;
      text-decoration: none; transition: transform .15s, background .15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--orange); color: var(--white); }
    .btn-primary:hover { background: var(--orange-dark); }
    .btn-ghost { border: 1px solid var(--platinum); color: var(--white); }
    @media (max-width: 820px) {
      .hero .wrap { grid-template-columns: 1fr; }
      .hero img { max-width: 480px; margin: 0 auto; }
    }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 40px; }
    .stat { background: var(--white); border-radius: var(--radius); padding: 24px; border-top: 4px solid var(--orange); }
    .stat b { display: block; font-family: Cambria, Georgia, serif; font-size: 2.4rem; color: var(--orange); line-height: 1.1; }
    .stat span { color: var(--ink-2); font-size: .95rem; }
    .gap-note { margin-top: 28px; padding: 20px 24px; background: var(--white); border-left: 4px solid var(--platinum); border-radius: 0 var(--radius) var(--radius) 0; color: var(--ink-2); }
    @media (max-width: 820px) { .stats { grid-template-columns: repeat(2, 1fr); } }

    /* Pillars */
    .dark { background: var(--ink); color: var(--white); }
    .dark .lead { color: var(--platinum); }
    .vm { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 32px 0; }
    .vm div { background: rgba(255,255,255,.04); border: 1px solid rgba(183,192,195,.2); border-radius: var(--radius); padding: 28px; }
    .vm h3 { color: var(--orange); font-family: inherit; font-size: .85rem; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 8px; }
    .vm p { color: var(--platinum-light); font-size: 1.1rem; }
    .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .pillar { padding: 24px; border-radius: var(--radius); background: rgba(255,255,255,.04); }
    .pillar .num {
      width: 36px; height: 36px; border-radius: 50%; background: var(--orange); color: var(--white);
      display: grid; place-items: center; font-weight: 800; margin-bottom: 14px;
    }
    .pillar h3 { font-size: 1.15rem; margin-bottom: 6px; }
    .pillar p { color: var(--platinum); font-size: .95rem; }
    @media (max-width: 900px) { .vm, .pillars { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 600px) { .vm, .pillars { grid-template-columns: 1fr; } }

    /* Format */
    .format { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 32px; }
    .card { background: var(--white); border-radius: var(--radius); padding: 26px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .card h3 { font-family: inherit; font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; color: var(--orange); margin-bottom: 8px; }
    .card p { color: var(--ink-2); }
    @media (max-width: 900px) { .format { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 600px) { .format { grid-template-columns: 1fr; } }

    /* Agenda */
    .coming {
      margin-top: 32px; border: 2px dashed var(--platinum); border-radius: var(--radius);
      padding: 56px 24px; text-align: center; background: var(--white);
    }
    .coming .big { font-family: Cambria, Georgia, serif; font-size: clamp(2rem, 5vw, 3rem); color: var(--orange); }
    .coming p { color: var(--ink-2); max-width: 560px; margin: 10px auto 24px; }
    .timeline { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
    .slot { padding: 10px 16px; border-radius: 10px; background: var(--paper); color: var(--steel); font-size: .9rem; }
    .slot b { color: var(--ink-2); }

    /* Speakers */
    .speakers { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-top: 32px; }
    .speaker { background: var(--white); border-radius: var(--radius); padding: 28px 24px; text-align: center; position: relative; }
    .avatar {
      width: 112px; height: 112px; border-radius: 50%; margin: 0 auto 16px;
      display: grid; place-items: center; font-family: Cambria, Georgia, serif; font-size: 2.4rem; font-weight: 700;
      color: var(--white); background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      box-shadow: 0 0 0 4px var(--white), 0 0 0 6px var(--orange-light);
    }
    .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .speaker h3 { font-size: 1.3rem; }
    .role { display: inline-block; margin: 8px 0 14px; font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--orange); }
    .socials { display: flex; justify-content: center; gap: 10px; }
    .socials a {
      width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
      background: var(--paper); color: var(--ink); transition: background .15s, color .15s;
    }
    .socials a:hover { background: var(--orange); color: var(--white); }
    .socials svg { width: 18px; height: 18px; fill: currentColor; }
    .speaker.tbd { border: 2px dashed var(--platinum); background: transparent; }
    .speaker.tbd .avatar { background: var(--platinum-light); color: var(--white); box-shadow: none; }
    .speaker.tbd h3 { color: var(--steel); }
    .speaker.tbd p { color: var(--steel); font-size: .95rem; margin-top: 8px; }

    /* Join */
    .join-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 32px; }
    .join-grid .card { background: rgba(255,255,255,.04); border: 1px solid rgba(183,192,195,.2); }
    .join-grid .card h3 { color: var(--orange); }
    .join-grid .card p { color: var(--platinum); margin-bottom: 16px; }
    .join-grid .card a { color: var(--white); font-weight: 700; text-decoration: none; }
    .join-grid .card a:hover { color: var(--orange-light); }
    .neutral { margin-top: 28px; color: var(--platinum); font-style: italic; }
    @media (max-width: 820px) { .join-grid { grid-template-columns: 1fr; } }

    footer { background: #1b1e1f; color: var(--steel); padding: 32px 0; font-size: .9rem; }
    footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    footer a { color: var(--platinum); text-decoration: none; }
  </style>
</head>

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function renderSpeakers(t) {
      const cards = SPEAKERS.map(s => `
        <article class="speaker">
          <div class="avatar">${s.photo ? `<img src="${esc(s.photo)}" alt="${esc(s.name)}">` : esc(s.initials)}</div>
          <h3>${esc(s.name)}</h3>
          <span class="role">${esc(t[s.roleKey])}</span>
          <div class="socials">
            <a href="${esc(s.linkedin)}" target="_blank" rel="noopener" aria-label="${esc(s.name)} · LinkedIn">${ICONS.linkedin}</a>
            <a href="${esc(s.x)}" target="_blank" rel="noopener" aria-label="${esc(s.name)} · X">${ICONS.x}</a>
          </div>
        </article>`);
      for (let i = 0; i < TBD_SLOTS; i++) {
        cards.push(`
        <article class="speaker tbd">
          <div class="avatar">?</div>
          <h3>${esc(t["speakers.tbdName"])}</h3>
          <p>${esc(t["speakers.tbdText"])}</p>
          <p><a href="mailto:we@netmad.es?subject=NetMAD%20-%20Call%20for%20speakers">${esc(t["speakers.tbdCta"])} →</a></p>
        </article>`);
      }
      document.getElementById("speaker-grid").innerHTML = cards.join("");
    }

    function setLang(lang) {
      if (!I18N[lang]) lang = "es";
      const t = I18N[lang];
      document.documentElement.lang = lang;
      document.title = t["meta.title"];
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const v = t[el.dataset.i18n];
        if (v !== undefined) el.textContent = v;
      });
      document.querySelectorAll(".lang-switch button").forEach(b =>
        b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
      renderSpeakers(t);
      try { localStorage.setItem("netmad-lang", lang); } catch (e) {}
    }

    document.querySelectorAll(".lang-switch button").forEach(b =>
      b.addEventListener("click", () => setLang(b.dataset.lang)));
    document.getElementById("year").textContent = new Date().getFullYear();

    // Spanish by default; ?lang=en or a previously chosen language overrides it.
    let initial = new URLSearchParams(location.search).get("lang");
    if (!initial) { try { initial = localStorage.getItem("netmad-lang"); } catch (e) {} }
    setLang(initial || "es");
